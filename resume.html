<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>黄家辉 · 简历 | 企业级 AI Agent 开发工程师 / FDE</title>
<meta name="description" content="黄家辉的在线简历：企业级 AI Agent 开发工程师 / FDE，6 年+ 企业科技服务（2021.04 至今），AI 工程实践 27 个月，主导 300+ 项目，RAG 检索 93.3% @3。可下载 PDF。">
<meta name="author" content="黄家辉">
<link rel="icon" type="image/svg+xml" href="./favicon.svg">
<link rel="icon" type="image/png" sizes="32x32" href="./favicon.png">
<link rel="stylesheet" href="./styles.css">
<link rel="stylesheet" href="./resume.css">
</head>
<body class="resume-page">

<!-- 屏幕端工具条：打印时隐藏 -->
<div class="resume-bar no-print">
  <a class="resume-bar__back" href="./index.html">← 返回作品集</a>
  <div class="resume-bar__actions">
    <div class="resume-switch" role="group" aria-label="简历版本切换">
      <button type="button" data-ver="agent" class="is-active" aria-pressed="true">AI Agent 版</button>
      <button type="button" data-ver="fde" aria-pressed="false">FDE 版</button>
    </div>
    <!-- 真实 PDF 文件（由 tools/build-resume-pdf.mjs 用 Edge 无头打印生成）。
         href 随版本切换由 resume.js 同步 —— 否则会出现「界面显示 FDE 版、
         点下载却拿到 AI Agent 版」的错配。 -->
    <a class="btn btn-primary" id="btn-download" href="./resume-ai-agent.pdf" download>下载 PDF 简历（AI Agent 版）</a>
    <!-- 兜底路径：走打印对话框另存为 PDF。文案必须写「打印」，
         不得与上面的「下载」混用（brief P0-1 明确要求）。 -->
    <button type="button" class="btn btn-ghost" id="btn-print">打印为 PDF（Ctrl/Cmd + P）</button>
  </div>
</div>

<main class="a4" id="resume-root">
  <!-- 内容由 resume.js 从 resume-data.js 渲染，保证与主页同源 -->
</main>

<script src="./resume-data.js"></script>
<script src="./resume.js"></script>
</body>
</html>
