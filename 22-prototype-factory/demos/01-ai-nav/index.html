<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AI 工具导航</title>
<style>
  :root {
    --bg: #0d1117;
    --surface: #161b22;
    --surface-hover: #1c2333;
    --border: #30363d;
    --text: #e6edf3;
    --text-dim: #8b949e;
    --accent: #58a6ff;
    --accent-soft: rgba(88,166,255,.12);
    --shadow: 0 8px 24px rgba(0,0,0,.4);
  }
  html[data-theme="light"] {
    --bg: #f6f8fa;
    --surface: #ffffff;
    --surface-hover: #f3f4f6;
    --border: #d0d7de;
    --text: #1f2328;
    --text-dim: #636c76;
    --accent: #0969da;
    --accent-soft: rgba(9,105,218,.08);
    --shadow: 0 8px 24px rgba(31,35,40,.12);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans SC", "PingFang SC", "Microsoft YaHei", sans-serif;
    line-height: 1.6;
    min-height: 100vh;
    transition: background-color .35s ease, color .35s ease;
    overflow-x: hidden;
  }
  .wrap { max-width: 1080px; margin: 0 auto; padding: 0 20px; }

  header { border-bottom: 1px solid var(--border); transition: border-color .35s ease; }
  .bar {
    display: flex; align-items: center; justify-content: space-between;
    height: 60px; gap: 12px;
  }
  .logo {
    display: flex; align-items: center; gap: 9px;
    font-weight: 700; font-size: 15px; letter-spacing: -.01em;
    min-width: 0;
  }
  .logo-mark {
    width: 26px; height: 26px; border-radius: 7px; flex: none;
    background: linear-gradient(135deg, var(--accent), #a371f7);
    display: grid; place-items: center;
    color: #fff; font-size: 13px; font-weight: 800;
  }
  .logo-text { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .theme-btn {
    flex: none;
    display: inline-flex; align-items: center; gap: 6px;
    background: var(--surface); color: var(--text);
    border: 1px solid var(--border); border-radius: 8px;
    padding: 7px 12px; font-size: 13px; font-family: inherit;
    cursor: pointer;
    transition: background-color .2s, border-color .2s, transform .1s;
  }
  .theme-btn:hover { background: var(--surface-hover); border-color: var(--accent); }
  .theme-btn:active { transform: scale(.96); }
  .theme-btn .icon { font-size: 14px; line-height: 1; }

  .hero { padding: 56px 0 40px; text-align: center; }
  .hero h1 {
    font-size: clamp(26px, 6vw, 44px);
    line-height: 1.2; letter-spacing: -.025em;
    font-weight: 800; margin-bottom: 14px;
    background: linear-gradient(135deg, var(--text) 30%, var(--accent));
    -webkit-background-clip: text; background-clip: text;
    -webkit-text-fill-color: transparent;
  }
  .hero p {
    color: var(--text-dim); font-size: clamp(13px, 3.4vw, 16px);
    max-width: 520px; margin: 0 auto 28px;
  }

  .search-box {
    position: relative; max-width: 460px; margin: 0 auto;
  }
  .search-box .mag {
    position: absolute; left: 14px; top: 50%; transform: translateY(-50%);
    color: var(--text-dim); font-size: 15px; pointer-events: none;
  }
  #search {
    width: 100%;
    background: var(--surface); color: var(--text);
    border: 1px solid var(--border); border-radius: 10px;
    padding: 12px 40px 12px 40px;
    font-size: 14px; font-family: inherit;
    transition: border-color .2s, box-shadow .2s, background-color .35s;
  }
  #search::placeholder { color: var(--text-dim); }
  #search:focus {
    outline: none;
    border-color: var(--accent);
    box-shadow: 0 0 0 3px var(--accent-soft);
  }
  #clear {
    position: absolute; right: 8px; top: 50%; transform: translateY(-50%);
    width: 26px; height: 26px; border-radius: 6px;
    border: none; background: transparent; color: var(--text-dim);
    font-size: 16px; cursor: pointer; display: none;
    align-items: center; justify-content: center;
    transition: background-color .2s, color .2s;
  }
  #clear:hover { background: var(--surface-hover); color: var(--text); }
  #clear.show { display: flex; }

  .meta {
    text-align: center; color: var(--text-dim);
    font-size: 12.5px; margin: 18px 0 4px;
    min-height: 19px;
  }

  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
    gap: 14px;
    padding: 20px 0 64px;
  }
  .card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 18px;
    display: flex; flex-direction: column; gap: 10px;
    cursor: pointer;
    transition: transform .22s cubic-bezier(.2,.8,.2,1),
                border-color .22s, box-shadow .22s, background-color .35s;
    animation: rise .42s cubic-bezier(.2,.8,.2,1) both;
  }
  @keyframes rise {
    from { opacity: 0; transform: translateY(14px); }
    to   { opacity: 1; transform: translateY(0); }
  }
  .card:hover {
    transform: translateY(-4px);
    border-color: var(--accent);
    box-shadow: var(--shadow);
  }
  .card:active { transform: translateY(-1px) scale(.99); }
  .card-top { display: flex; align-items: center; gap: 11px; }
  .card-icon {
    width: 38px; height: 38px; border-radius: 10px; flex: none;
    display: grid; place-items: center;
    font-size: 18px;
    background: var(--accent-soft);
    border: 1px solid var(--border);
    transition: transform .22s;
  }
  .card:hover .card-icon { transform: scale(1.08) rotate(-4deg); }
  .card-name { font-weight: 650; font-size: 14.5px; letter-spacing: -.01em; }
  .card-cat {
    font-size: 11px; color: var(--text-dim);
    text-transform: uppercase; letter-spacing: .06em;
  }
  .card-desc {
    font-size: 13px; color: var(--text-dim); line-height: 1.55;
    flex: 1;
  }
  .empty {
    grid-column: 1 / -1;
    text-align: center; padding: 56px 20px;
    color: var(--text-dim); font-size: 14px;
  }
  .empty .big { font-size: 34px; margin-bottom: 10px; opacity: .5; }

  @media (max-width: 600px) {
    .wrap { padding: 0 14px; }
    .hero { padding: 40px 0 28px; }
    .grid { grid-template-columns: 1fr; gap: 11px; }
    .bar { height: 56px; }
    .logo-text { font-size: 14px; }
    .theme-btn { padding: 6px 10px; font-size: 12px; }
    .theme-btn .label { display: none; }
  }
  @media (prefers-reduced-motion: reduce) {
    * { animation-duration: .01ms !important; transition-duration: .01ms !important; }
  }
</style>
</head>
<body>
<header>
  <div class="wrap bar">
    <div class="logo">
      <div class="logo-mark">AI</div>
      <div class="logo-text">工具导航</div>
    </div>
    <button class="theme-btn" id="themeBtn" aria-label="切换深色/浅色主题">
      <span class="icon" id="themeIcon">🌙</span>
      <span class="label" id="themeLabel">深色</span>
    </button>
  </div>
</header>

<main class="wrap">
  <section class="hero">
    <h1>发现好用的 AI 工具</h1>
    <p>精选 6 款日常高频 AI 工具，覆盖写作、绘画、编程与效率场景。</p>
    <div class="search-box">
      <span class="mag">🔍</span>
      <input id="search" type="search" placeholder="搜索工具名称或描述…" autocomplete="off" aria-label="搜索工具">
      <button id="clear" aria-label="清空搜索">×</button>
    </div>
    <div class="meta" id="meta"></div>
  </section>

  <section class="grid" id="grid" aria-live="polite"></section>
</main>

<script>
(function () {
  "use strict";

  var TOOLS = [
    { icon: "✍️", name: "CopyCraft", cat: "写作", desc: "一句话生成营销文案，支持多语气一键切换。" },
    { icon: "🎨", name: "PixelMind",  cat: "绘画", desc: "文字描述直接出图，内置 12 种艺术风格模板。" },
    { icon: "💻", name: "CodePilot",  cat: "编程", desc: "在编辑器里补全代码，自动解释报错原因。" },
    { icon: "🎬", name: "ClipForge",  cat: "视频", desc: "长视频自动切条，生成带字幕的短视频素材。" },
    { icon: "📊", name: "DataLens",   cat: "分析", desc: "上传表格即出图表，自然语言提问取数。" },
    { icon: "🎧", name: "VoiceSmith", cat: "音频", desc: "文字转多语种自然语音，支持情绪调节。" }
  ];

  var grid     = document.getElementById("grid");
  var search   = document.getElementById("search");
  var clearBtn = document.getElementById("clear");
  var meta     = document.getElementById("meta");
  var themeBtn = document.getElementById("themeBtn");
  var themeIcon  = document.getElementById("themeIcon");
  var themeLabel = document.getElementById("themeLabel");

  var THEME_KEY = "ai-nav-theme";

  function applyTheme(theme) {
    document.documentElement.setAttribute("data-theme", theme);
    var dark = theme === "dark";
    themeIcon.textContent  = dark ? "🌙" : "☀️";
    themeLabel.textContent = dark ? "深色" : "浅色";
    themeBtn.setAttribute("aria-pressed", String(dark));
    try { localStorage.setItem(THEME_KEY, theme); } catch (e) {}
  }

  function initTheme() {
    var saved = null;
    try { saved = localStorage.getItem(THEME_KEY); } catch (e) {}
    if (saved === "dark" || saved === "light") { applyTheme(saved); return; }
    var prefersLight = window.matchMedia &&
      window.matchMedia("(prefers-color-scheme: light)").matches;
    applyTheme(prefersLight ? "light" : "dark");
  }

  themeBtn.addEventListener("click", function () {
    var now = document.documentElement.getAttribute("data-theme");
    applyTheme(now === "dark" ? "light" : "dark");
  });

  function cardHTML(tool, index) {
    return '<article class="card" tabindex="0" role="button" ' +
             'aria-label="' + esc(tool.name) + '：' + esc(tool.desc) + '" ' +
             'style="animation-delay:' + (index * 45) + 'ms">' +
             '<div class="card-top">' +
               '<div class="card-icon">' + tool.icon + '</div>' +
               '<div>' +
                 '<div class="card-name">' + esc(tool.name) + '</div>' +
                 '<div class="card-cat">' + esc(tool.cat) + '</div>' +
               '</div>' +
             '</div>' +
             '<p class="card-desc">' + esc(tool.desc) + '</p>' +
           '</article>';
  }

  function esc(s) {
    return String(s).replace(/[&<>"']/g, function (c) {
      return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
    });
  }

  function render(keyword) {
    var q = String(keyword || "").trim().toLowerCase();
    var list = TOOLS.filter(function (t) {
      if (!q) return true;
      return t.name.toLowerCase().indexOf(q) >= 0 ||
             t.desc.toLowerCase().indexOf(q) >= 0 ||
             t.cat.toLowerCase().indexOf(q) >= 0;
    });

    if (list.length === 0) {
      grid.innerHTML = '<div class="empty"><div class="big">🔍</div>' +
        '没有匹配 “' + esc(keyword) + '” 的工具<br>试试换个关键词</div>';
    } else {
      grid.innerHTML = list.map(cardHTML).join("");
    }

    meta.textContent = q
      ? "找到 " + list.length + " / " + TOOLS.length + " 个工具"
      : "共 " + TOOLS.length + " 个工具";
  }

  search.addEventListener("input", function () {
    clearBtn.classList.toggle("show", search.value.length > 0);
    render(search.value);
  });

  clearBtn.addEventListener("click", function () {
    search.value = "";
    clearBtn.classList.remove("show");
    render("");
    search.focus();
  });

  // 卡片键盘可达
  grid.addEventListener("keydown", function (e) {
    if (e.key === "Enter" || e.key === " ") {
      var card = e.target.closest(".card");
      if (card) { e.preventDefault(); card.click(); }
    }
  });

  initTheme();
  render("");
})();
</script>
</body>
</html>
